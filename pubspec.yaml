name: gestbanda
description: "Mobile client of GestBanda, a management app for marching bands."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  cached_network_image: ^3.3.1
  carousel_slider: ^5.0.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.3.3
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.0.10+1
  go_router: ^14.1.4
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  riverpod_annotation: ^2.3.5
  table_calendar: ^3.1.2
  http: ^1.2.2
  http_parser: ^4.0.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  mockito: ^5.3.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/
